name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    
    steps:
      - name: Wake Up Server
        run: |
          echo "Waking up Render server..."
          curl -v https://license-automation.onrender.com/ 
          sleep 2
          curl -v https://license-automation.onrender.com/health
      
      - name: Verify Online
        run: echo "✓ Server active at $(date)"
