name: Keep Render Alive

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  
  # Allows manual trigger from Actions tab
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging Render server..."
          curl -f https://license-automation.onrender.com/health || echo "Ping failed"
          echo "Ping complete!"
      
      - name: Log timestamp
        run: echo "Last ping at $(date)"
